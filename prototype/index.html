<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

<body>
  <main class="game-shell">
    <header class="game-topbar">
      <div class="game-title"><span class="title-mark">&#10022;</span><span>&#20313;&#28908;&#24037;&#22346;</span></div>
      <div class="battle-actions">
        <button id="start" class="primary">&#9654; &#24320;&#22987;</button>
        <button id="pause" disabled>&#26242;&#20572;</button>
        <button id="reset" class="quiet">&#8635; &#37325;&#32622;</button>
        <label class="enemy-select">&#23545;&#25163; <select id="enemy" aria-label="&#36873;&#25321;&#23545;&#25163;"></select></label>
        <label class="switch"><input id="linksEnabled" type="checkbox" checked> &#32852;&#21160;</label>
        <div class="speed-controls" aria-label="&#25112;&#26007;&#36895;&#24230;"><button data-speed="0.5" class="active">0.5&#215;</button><button data-speed="1">1&#215;</button><button data-speed="2">2&#215;</button><button data-speed="4">4&#215;</button></div>
        <div class="loadout-buttons" aria-label="&#35013;&#22791;&#32534;&#36753;"><button id="loadoutOpen" type="button">&#10022; &#27861;&#26454; / &#32972;&#21253;</button></div>
      </div>
    </header>

    <section class="battle-view" aria-label="&#25112;&#26007;&#22330;&#26223;">
      <div class="battle-hud"><div class="hud-side player-hud"><div class="hud-name">&#20320;&#30340;&#35282;&#33394; <b id="playerHpText"></b></div><div class="health"><i id="playerHpBar"></i></div><div class="actor-effects" id="playerEffects"></div></div><div class="battle-clock"><b id="clock">00.00</b><small id="phase">&#31561;&#24453;&#21551;&#21160;</small></div><div class="hud-side enemy-hud"><div class="hud-name"><b id="enemyName"></b> <span id="enemyHpText"></span></div><div class="health"><i id="enemyHpBar"></i></div><div class="actor-effects" id="enemyEffects"></div></div></div>
      <div class="stage"><canvas id="arena" width="1100" height="330" aria-label="&#36951;&#36857;&#31454;&#25216;&#22330;&#25112;&#26007;&#30011;&#38754;"></canvas></div>
      <div id="result" class="battle-result" hidden aria-live="polite"></div>
    </section>
  </main>

  <section id="loadoutModal" class="loadout-modal" hidden aria-label="&#35013;&#22791;&#32534;&#36753;">
    <div class="loadout-backdrop" data-close-loadout></div>
    <div class="loadout-dialog" role="dialog" aria-modal="true" aria-labelledby="loadoutTitle">
      <header class="loadout-dialog-top">
        <div><h2 id="loadoutTitle">&#27861;&#26454; / &#32972;&#21253;</h2><span id="modalStatus" class="muted">&#25112;&#26007;&#24320;&#22987;&#21518;&#23558;&#38145;&#23450;</span></div>
        <div class="loadout-dialog-actions"><button id="closeLoadout" type="button" class="close-loadout" aria-label="&#20851;&#38381;">&#10005;</button></div>
      </header>
      <div id="loadoutDialogBody" class="loadout-dialog-body" data-view="all">
        <section class="loadout-panel wand-panel" data-loadout-panel="wand"><div class="section-bar"><h2>&#27861;&#26454;</h2><span id="budget" class="badge"></span></div><div id="wandEditors"></div><p id="error" class="error" role="alert"></p></section>
        <section class="loadout-panel bag-panel" data-loadout-panel="bag"><div class="section-bar"><h2>&#32972;&#21253;</h2><span id="installTarget" class="target-label"></span></div><div class="filters"><button data-filter="all" class="active">&#20840;&#37096;</button><button data-filter="spell">&#27861;&#26415;</button><button data-filter="rune">&#31526;&#25991;</button></div><div id="library"></div></section>
        <section class="loadout-panel spell-panel" data-loadout-panel="wand"><div class="section-bar"><h2>&#27861;&#26415;&#21442;&#25968;</h2><span class="muted">&#36873;&#25321;&#21345;&#27133;&#32534;&#36753;</span></div><div id="inspector"></div></section>
      </div>
    </div>
  </section>

  <script src="link-engine.js?v=20260928-4"></script>
  <script src="link-app.js?v=20260928-4"></script>
</body>
</html>
